<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Beauregard — test transport RC2</title><style>body{font:18px system-ui;max-width:48rem;margin:3rem auto;padding:1rem;background:#f7f4e8;color:#18443d}button{padding:1rem}pre{white-space:pre-wrap}</style><h1>Test technique RC2</h1><p>Vérifie le dialogue direct fetch/JSON : GET ping puis POST sans session sur la copie de test. Aucune donnée personnelle et aucun envoi d’e-mail.</p><button id="run">Tester le dialogue Apps Script</button><pre id="result" role="status">Prêt.</pre><script>window.BEAUREGARD_CONFIG={API_URL:"https://script.google.com/macros/s/AKfycbyWl3_KB0OEhLp9IBmoYmTfEvHvkgec9UxxPuItj0xsvokh4LvV3vxJ154Vp4YrgDcv/exec"};</script><script>/* IndexedDB : une base par utilisateur, file durable et médias conservés localement. */
window.Store = (() => {
  let db;
  function open() {
    return new Promise((resolve, reject) => {
      const r = indexedDB.open("beauregard-v21", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => {
        db = r.result;
        resolve();
      };
      r.onerror = () => reject(r.error);
    });
  }
  async function run(mode, fn) {
    if (!db) await open();
    return new Promise((res, rej) => {
      const tx = db.transaction("kv", mode),
        r = fn(tx.objectStore("kv"));
      let value;
      r.onsuccess = () => (value = r.result);
      tx.oncomplete = () => res(value);
      tx.onerror = () => rej(tx.error);
    });
  }
  return {
    get: (k) => run("readonly", (s) => s.get(k)),
    set: (k, v) => run("readwrite", (s) => s.put(v, k)),
    del: (k) => run("readwrite", (s) => s.delete(k)),
    clear: () => run("readwrite", (s) => s.clear()),
  };
})();
/* Dialogue direct fetch/JSON repris de la V1 (apiGet_).
 * GET pour le contrôle public ; POST pour les données et secrets V2.
 * Aucun iframe, postMessage, JSONP ou contournement no-cors.
 */
window.Transport = async function (action, data = {}, session = {}, opId) {
  const base = window.BEAUREGARD_CONFIG?.API_URL;
  if (!base) throw Error("URL Apps Script manquante");
  const requestId = crypto.randomUUID();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 60000);
  try {
    const url = new URL(base);
    const options = { cache: "no-store", redirect: "follow", credentials: "omit", signal: controller.signal };
    if (action === "ping") {
      url.searchParams.set("api", "ping");
      options.method = "GET";
    } else {
      options.method = "POST";
      options.body = new URLSearchParams({ payload: JSON.stringify({
        action, data, token: session.token || "", requestId, opId,
      }) });
    }
    const response = await fetch(url.toString(), options);
    if (!response.ok) throw Error("HTTP_" + response.status);
    let out;
    try { out = await response.json(); }
    catch (_) { throw Error("Réponse non JSON : vérifier le déploiement Apps Script et ses droits d’accès."); }
    if (action !== "ping" && out.requestId !== requestId)
      throw Error("Réponse serveur incohérente");
    if (!out.ok) throw Error(out.error || "Erreur serveur");
    return out.data;
  } catch (e) {
    if (e.name === "AbortError")
      throw Error("Le serveur ne répond pas après 60 secondes. L’action en attente est conservée.");
    throw e;
  } finally { clearTimeout(timer); }
};
</script><script>document.getElementById("run").onclick=async()=>{const out=document.getElementById("result"),button=document.getElementById("run");button.disabled=true;out.textContent="Test GET ping…";try{const ping=await Transport("ping");out.textContent="GET JSON reçu : "+JSON.stringify(ping)+"\nTest POST sans session…";try{await Transport("sync");out.textContent+="\nÉCHEC : session non exigée."}catch(e){out.textContent+=e.message==="SESSION_EXPIRED"?"\nSUCCÈS : GET JSON et POST JSON vérifiés. SESSION_EXPIRED attendu sans session.":"\nÉCHEC POST : "+e.message}}catch(e){out.textContent="ÉCHEC GET : "+e.message+"\nLe backend est privé : vérifier ses droits d’accès avant de conclure à un défaut du protocole."}finally{button.disabled=false}};</script></html>
